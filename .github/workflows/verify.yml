name: Verify Roam
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  automated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
      - name: Run server and signaling integration tests
        run: npm test
